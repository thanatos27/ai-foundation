# AI Foundation static configuration (see docs/specs/mvp-v0.1.md §13).
# Do not list projects, IDs or other dynamic data here.
# Never put credentials in this file — use environment variables (.env).
version: "0.1"

defaults:
  area: personal
  timezone: Asia/Tokyo

sources:
  task:
    provider: todoist

  schedule:
    provider: google_calendar
    # The only calendars AI Foundation writes to, by alias (required by
    # schedule_create / schedule_update; schedule_list reads every calendar).
    # Aliases: lowercase letters, digits, "_" or "-". Copy each ID from the
    # calendar's settings ("Integrate calendar"); never use "primary".
    # This repository is public: do not set them here. Copy this file to
    # config.local.yaml (git-ignored), set them there and start the server with
    # --config config.local.yaml or AI_FOUNDATION_CONFIG.
    # default_calendar: personal
    # writable_calendars:
    #   personal: "xxxxxxxx@group.calendar.google.com"   # events you plan to attend
    #   events: "yyyyyyyy@group.calendar.google.com"     # event periods you are interested in

  collection:
    provider: notion
    # The AI Foundation Collection data source (required by the collection tools).
    # This repository is public: do not set it here. Set it in config.local.yaml
    # (see README "Notion").
    # data_source_id: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"

  knowledge:
    default: obsidian
    providers:
      - obsidian
    obsidian:
      storage: filesystem
      # The only directory the knowledge tools read and write, relative to the vault.
      knowledge_dir: "AI Foundation/Knowledge"
      # The Obsidian vault on this machine (required by the knowledge tools). It may be
      # inside a Google Drive (or other) sync folder; AI Foundation does not manage syncing.
      # This repository is public: do not set it here. Set it in config.local.yaml
      # (see README "Obsidian").
      # vault_path: "C:/Users/you/Documents/Obsidian/MyVault"

  project:
    # Projects are the GitHub repositories GITHUB_TOKEN can access (1 repository = 1 project).
    # Do not list projects or repositories here; limit them with the token's repository access.
    providers:
      - github

  area:
    # PARA areas (not defaults.area): the child pages directly under one Notion page
    # (see README "Areas"). Do not list areas here; add or remove child pages in Notion.
    provider: notion
    # The Areas parent page (required by the area tools).
    # This repository is public: do not set it here. Set it in config.local.yaml.
    # notion:
    #   parent_page_id: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

  lifelog:
    # Occasional life events (trips, outings, events) as free-form Markdown articles,
    # one file per article: <directory>/YYYY-MM-DD-<title>.md (see README "Life Log").
    # The vault is sources.knowledge.obsidian.vault_path. Create the directory yourself;
    # it must not be the same as, inside or contain knowledge_dir.
    provider: obsidian
    obsidian:
      directory: "AI Foundation/LifeLog"
