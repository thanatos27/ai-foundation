# AI Foundation static configuration (see docs/specs/mvp-v0.1.md §13).
# Do not list projects, IDs or other dynamic data here.
# Never put credentials in this file — use environment variables (.env).
version: "0.1"

defaults:
  area: personal
  timezone: Asia/Tokyo

sources:
  task:
    provider: todoist

  schedule:
    provider: google_calendar
    # The only calendar AI Foundation writes to (required by schedule_create).
    # This repository is public: do not set it here. Copy this file to
    # config.local.yaml (git-ignored), set it there and start the server with
    # --config config.local.yaml or AI_FOUNDATION_CONFIG.
    # writable_calendar_id: "xxxxxxxx@group.calendar.google.com"

  collection:
    provider: notion
    # The AI Foundation Collection data source (required by the collection tools).
    # This repository is public: do not set it here. Set it in config.local.yaml
    # (see README "Notion").
    # data_source_id: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"

  knowledge:
    default: obsidian
    providers:
      - obsidian
    obsidian:
      storage: filesystem
      # The only directory the knowledge tools read and write, relative to the vault.
      knowledge_dir: "AI Foundation/Knowledge"
      # The Obsidian vault on this machine (required by the knowledge tools). It may be
      # inside a Google Drive (or other) sync folder; AI Foundation does not manage syncing.
      # This repository is public: do not set it here. Set it in config.local.yaml
      # (see README "Obsidian").
      # vault_path: "C:/Users/you/Documents/Obsidian/MyVault"

  project:
    providers:
      - github
      - google_drive
